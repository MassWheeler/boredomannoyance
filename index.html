<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cute Mini Site 💕</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #ffd6e7, #c9f0ff);
    display: flex;
    justify-content: center;
    align-items: center;
    transition: background 0.6s ease;
  }
  .card {
    background: white;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    border-radius: 16px;
    padding: 40px 30px;
    text-align: center;
    max-width: 300px;
    width: 80%;
    animation: pop 0.5s ease;
  }
  @keyframes pop {
    from { transform: scale(0.9); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  h2 {
    font-weight: 600;
    color: #444;
    margin-bottom: 25px;
  }
  .buttons {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 20px;
  }
  button {
    border: none;
    padding: 10px 25px;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
    transition: transform 0.2s ease, background 0.3s ease;
  }
  .yes {
    background: #ff90b3;
    color: white;
  }
  .yes:hover {
    background: #ff6c9e;
    transform: scale(1.1);
  }
  .no {
    background: #d8d8d8;
    color: #555;
    position: relative;
  }
  .hidden {
    display: none;
  }
  .final {
    font-size: 20px;
    color: #444;
    text-align: center;
  }
</style>
</head>
<body>

<div class="card" id="card">
  <h2 id="question">Do you wanna call when you’re home?</h2>
  <div class="buttons">
    <button class="yes" id="yesBtn">Yes</button>
    <button class="no" id="noBtn">No</button>
  </div>
</div>

<script>
const card = document.getElementById('card');
const question = document.getElementById('question');
const yesBtn = document.getElementById('yesBtn');
const noBtn = document.getElementById('noBtn');

let page = 1;

function nextPage() {
  page++;
  card.style.animation = 'none';
  void card.offsetWidth; // reset animation
  card.style.animation = 'pop 0.5s ease';

  if (page === 2) {
    question.textContent = "I’m bored, press yes";
  } else if (page === 3) {
    question.textContent = "Ok call me when you’re home. Sorry for the boredom, press yes";
  } else if (page === 4) {
    document.body.innerHTML = '<div class="final">sorry shaniah im so bored</div>';
    document.body.style.background = '#fff';
    return;
  }
}

yesBtn.addEventListener('click', nextPage);

function moveButton() {
  const x = Math.random() * 200 - 100;
  const y = Math.random() * 200 - 100;
  noBtn.style.transform = `translate(${x}px, ${y}px)`;
}

noBtn.addEventListener('mouseenter', moveButton);
noBtn.addEventListener('click', moveButton);
noBtn.addEventListener('touchstart', moveButton);
</script>

</body>
</html>
